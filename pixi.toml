[workspace]
name = "nova-boltz2-miner"
version = "0.1.0"
description = "Source-only Boltz-2 NOVA Blueprint miner"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.2,<2.5"
pandas = "2.2.3.*"
rdkit = "2024.09.4.*"
scipy = "1.15.1.*"
scikit-learn = "1.6.1.*"
pytest = ">=8.3,<9"

[tasks]
test = "python -m pytest -q"
